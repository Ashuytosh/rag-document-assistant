[project]
name = "rag-document-assistant"
version = "0.1.0"
description = "Document Q&A over local models with grounded, cited answers."
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Integration tests load the real embedding model (~90 MB download on first run), so
# they are deselected by default. Run them with: pytest -m integration
addopts = "-q -m 'not integration'"
markers = [
    "integration: exercises the real embedding model; slow, needs the model cached",
]
