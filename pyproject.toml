[project]
name = "rag-document-assistant"
version = "0.1.0"
description = "Document Q&A over local models with grounded, cited answers."
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
