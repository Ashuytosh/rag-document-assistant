<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ app_name }}</title>
    <!--
      Both CDN scripts are pinned to an exact version: they run with full access to a DOM
      holding the user's document text, and "@latest" would let the code executing here
      change with no change in this repo.

      Tailwind carries no integrity hash because cdn.tailwindcss.com serves no CORS
      headers, and subresource integrity requires them — adding `crossorigin` to satisfy
      SRI blocks the script outright and the page loads unstyled. The version pin is the
      protection available here.
    -->
    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <script
      src="https://unpkg.com/lucide@0.544.0/dist/umd/lucide.min.js"
      integrity="sha384-hK2uiaqTSh/v1VqRxmuMQL4xmt5n0DdyBCOItx2fAs7Wv+WC8Tu0yDW1j12JooyM"
      crossorigin="anonymous"
      defer
    ></script>
    <style>
      /* The two things Tailwind utilities cannot express: a caret that blinks and the
         staggered thinking dots. Everything else stays in the markup as utilities. */
      @keyframes blink { 0%, 49% { opacity: 1 } 50%, 100% { opacity: 0 } }
      .cursor::after {
        content: "";
        display: inline-block;
        width: 0.5rem;
        height: 1.05em;
        margin-left: 0.15rem;
        vertical-align: text-bottom;
        background-color: rgb(129 140 248);
        animation: blink 1s steps(1) infinite;
      }
      @keyframes dot { 0%, 60%, 100% { opacity: 0.25 } 30% { opacity: 1 } }
      .dot { animation: dot 1.2s ease-in-out infinite; }
      .dot:nth-child(2) { animation-delay: 0.15s; }
      .dot:nth-child(3) { animation-delay: 0.3s; }
      @media (prefers-reduced-motion: reduce) {
        .cursor::after, .dot { animation: none; }
      }
    </style>
  </head>
  <body class="h-full bg-zinc-950 text-zinc-100 antialiased">
    <script type="application/json" id="ui-config">
      {{ {"defaultTopK": default_top_k, "maxTopK": max_top_k} | tojson }}
    </script>

    <div class="mx-auto flex h-full max-w-3xl flex-col px-4 py-5 sm:px-6">
      <header class="mb-4 flex items-center gap-3">
        <span class="flex h-9 w-9 items-center justify-center rounded-xl border border-zinc-800 bg-zinc-900">
          <i data-lucide="file-search" class="h-4 w-4 text-indigo-400"></i>
        </span>
        <div>
          <h1 class="text-base font-medium leading-tight">{{ app_name }}</h1>
          <p class="text-xs text-zinc-500">Grounded answers with citations · v{{ app_version }}</p>
        </div>
      </header>

      <!-- Upload -->
      <section class="mb-3 rounded-xl border border-zinc-800 bg-zinc-900/40 p-4">
        <div class="flex flex-col gap-3 sm:flex-row sm:items-center">
          <div class="min-w-0 flex-1">
            <label for="file-input" class="mb-1 block text-xs text-zinc-400">
              Document (PDF or DOCX, up to {{ max_upload_mb }} MB)
            </label>
            <input
              id="file-input"
              type="file"
              accept=".pdf,.docx"
              class="block w-full cursor-pointer rounded-lg border border-zinc-800 bg-zinc-950 text-sm text-zinc-300 file:mr-3 file:cursor-pointer file:rounded-l-lg file:border-0 file:bg-zinc-800 file:px-3 file:py-2 file:text-sm file:text-zinc-200 hover:file:bg-zinc-700 focus:outline-none focus:ring-2 focus:ring-indigo-500"
            />
          </div>
          <button
            id="upload-button"
            type="button"
            class="inline-flex items-center justify-center gap-2 rounded-lg bg-indigo-600 px-4 py-2 text-sm font-medium text-white transition hover:bg-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:ring-offset-2 focus:ring-offset-zinc-950 disabled:cursor-not-allowed disabled:opacity-50 sm:mt-5"
          >
            <i data-lucide="upload" class="h-4 w-4"></i>
            Upload
          </button>
        </div>
        <p id="upload-status" class="mt-2 text-xs text-zinc-500" role="status" aria-live="polite">
          No document uploaded yet.
        </p>
      </section>

      <!-- Controls -->
      <section class="mb-3 flex flex-wrap items-end gap-3 rounded-xl border border-zinc-800 bg-zinc-900/40 p-4">
        <div class="min-w-[10rem] flex-1">
          <label for="model-select" class="mb-1 block text-xs text-zinc-400">Model</label>
          <select
            id="model-select"
            class="w-full rounded-lg border border-zinc-800 bg-zinc-950 px-3 py-2 text-sm text-zinc-200 focus:outline-none focus:ring-2 focus:ring-indigo-500"
          >
            {% for model in available_models %}
              <option value="{{ model }}" {% if model == default_model %}selected{% endif %}>{{ model }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="w-24">
          <label for="topk-input" class="mb-1 block text-xs text-zinc-400">Passages</label>
          <input
            id="topk-input"
            type="number"
            min="1"
            max="{{ max_top_k }}"
            value="{{ default_top_k }}"
            class="w-full rounded-lg border border-zinc-800 bg-zinc-950 px-3 py-2 text-sm text-zinc-200 focus:outline-none focus:ring-2 focus:ring-indigo-500"
          />
        </div>
        <label
          id="scope-label"
          for="scope-toggle"
          class="flex cursor-not-allowed items-center gap-2 py-2 text-sm text-zinc-500"
        >
          <input
            id="scope-toggle"
            type="checkbox"
            disabled
            class="h-4 w-4 rounded border-zinc-700 bg-zinc-950 text-indigo-500 focus:ring-2 focus:ring-indigo-500 disabled:opacity-50"
          />
          Only the last upload
        </label>
      </section>

      <!-- Chat -->
      <!--
        role="log" rather than aria-live: tokens arrive one DOM mutation at a time, and a
        live region on this container would queue an announcement per token. Completion is
        announced once, through #sr-status below.
      -->
      <main
        id="chat"
        tabindex="0"
        role="log"
        class="flex-1 space-y-4 overflow-y-auto rounded-xl border border-zinc-800 bg-zinc-900/20 p-4 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500"
        aria-label="Conversation"
      >
        <p id="chat-empty" class="py-10 text-center text-sm text-zinc-600">
          Upload a document, then ask a question about it.
        </p>
      </main>
      <p id="sr-status" class="sr-only" role="status" aria-live="polite"></p>

      <!-- Composer -->
      <section class="mt-3">
        <div class="flex items-end gap-2 rounded-xl border border-zinc-800 bg-zinc-900/40 p-2 focus-within:ring-2 focus-within:ring-indigo-500">
          <label for="question-input" class="sr-only">Your question</label>
          <textarea
            id="question-input"
            rows="1"
            placeholder="Ask a question about your documents"
            class="max-h-40 flex-1 resize-none bg-transparent px-2 py-2 text-sm text-zinc-100 placeholder:text-zinc-600 focus:outline-none"
          ></textarea>
          <button
            id="send-button"
            type="button"
            class="inline-flex h-9 w-9 shrink-0 items-center justify-center rounded-lg bg-indigo-600 text-white transition hover:bg-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:ring-offset-2 focus:ring-offset-zinc-950 disabled:cursor-not-allowed disabled:opacity-50"
            aria-label="Send question"
          >
            <i data-lucide="arrow-up" class="h-4 w-4"></i>
          </button>
        </div>
        <p class="mt-1.5 px-1 text-xs text-zinc-600">
          Enter sends · Shift+Enter for a new line. Answers come only from your documents.
        </p>
      </section>
    </div>

    <script src="/static/app.js" defer></script>
  </body>
</html>
